[project]
name = "cortes-live"
version = "0.1.0"
description = "Ferramenta local para cortar lives com legendas e presets de formato"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp[default]>=2025.11.12",
    "numpy>=1.26",
    "faster-whisper>=1.1.1",
    "pillow>=10.4",
    "requests>=2.31",
    "onnxruntime>=1.18",            # recorte de fundo (modelo isnet do rembg)
    "opencv-python-headless>=4.9,<5",  # detecção de rosto (a 5.x removeu os classificadores Haar)
    "streamlink>=7",
]

[project.optional-dependencies]
# Bibliotecas CUDA para o Whisper na placa NVIDIA (o instalar.bat só instala se houver NVIDIA).
gpu = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]

[tool.uv]
package = false
